<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 440px; margin: 0; font: 13px system-ui, sans-serif; padding: 12px; box-sizing: border-box; }
  header { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  header select { flex: 1; padding: 5px; }
  button { padding: 6px 10px; border: 1px solid #8884; border-radius: 6px; cursor: pointer; background: #8881; font: inherit; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  button:disabled { opacity: .5; cursor: default; }
  #logline { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px; padding: 6px 8px; border: 1px dashed #8886; border-radius: 6px; }
  #logline span { flex: 1; }
  #bar { display: none; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  #status { margin: 8px 0; min-height: 18px; }
  #status.err { color: #d33; }
  #list { max-height: 400px; overflow-y: auto; }
  h3 { margin: 10px 0 6px; font-size: 13px; }
  h3.missing { color: #c2410c; }
  details { margin-bottom: 8px; }
  summary { cursor: pointer; font-weight: 600; margin: 6px 0; }
  .row { border: 1px solid #8884; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
  .row.miss { border-color: #c2410c99; }
  .lbl { font-weight: 600; margin-bottom: 4px; word-break: break-word; }
  .meta { font-weight: 400; opacity: .6; font-size: 11px; }
  .row textarea, .row input, .row select { width: 100%; box-sizing: border-box; font: inherit; padding: 4px; }
  .row textarea { min-height: 30px; resize: vertical; }
  .actions { display: flex; gap: 6px; margin-top: 4px; }
  a { cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <select id="profile"></select>
    <button id="go" class="primary">Scan &amp; suggest</button>
  </header>
  <div id="logline"><span id="logtext"></span><button id="markApplied">Mark as applied</button></div>
  <div id="bar">
    <button id="fillAll" class="primary">Fill all on page</button>
    <button id="fillNext">Fill &amp; Next step</button>
    <button id="copyAll">Copy all</button>
  </div>
  <div id="status"></div>
  <div id="list"></div>
  <p><a id="opts">Settings / profile</a> &middot; <a id="logLink">Application log</a></p>
  <script src="popup.js"></script>
</body>
</html>
